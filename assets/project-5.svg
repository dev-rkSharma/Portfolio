<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Map grid with dynamic geospatial markers derived from geohashed object properties">
  <defs>
    <pattern id="p5-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.1" cy="1.1" r="1.1" fill="#ABB2BF" />
    </pattern>
  </defs>

  <rect width="600" height="340" fill="#2E333B" />
  <rect width="600" height="340" fill="url(#p5-dots)" opacity="0.12" />
  <rect x="0.5" y="0.5" width="599" height="339" fill="none" stroke="#3D434D" />

  <!-- geohash grid -->
  <g stroke="#ABB2BF" stroke-opacity="0.3" fill="none">
    <rect x="90" y="60" width="420" height="220" />
    <line x1="230" y1="60" x2="230" y2="280" />
    <line x1="370" y1="60" x2="370" y2="280" />
    <line x1="90" y1="133" x2="510" y2="133" />
    <line x1="90" y1="207" x2="510" y2="207" />
  </g>

  <!-- dynamic, stylized markers at varying prominence -->
  <g fill="#C778DD">
    <path d="M160 100c-11 0-20 9-20 20 0 15 20 34 20 34s20-19 20-34c0-11-9-20-20-20z" opacity="0.9"/>
    <circle cx="160" cy="120" r="6" fill="#2E333B"/>
  </g>
  <g fill="#C778DD" opacity="0.55">
    <path d="M300 150c-9 0-16 7-16 16 0 12 16 27 16 27s16-15 16-27c0-9-7-16-16-16z"/>
    <circle cx="300" cy="166" r="5" fill="#2E333B"/>
  </g>
  <g fill="#C778DD" opacity="0.7">
    <path d="M420 190c-9 0-16 7-16 16 0 12 16 27 16 27s16-15 16-27c0-9-7-16-16-16z"/>
    <circle cx="420" cy="206" r="5" fill="#2E333B"/>
  </g>
  <g fill="#C778DD" opacity="0.4">
    <path d="M460 90c-8 0-14 6-14 14 0 10 14 24 14 24s14-14 14-24c0-8-6-14-14-14z"/>
    <circle cx="460" cy="104" r="4" fill="#2E333B"/>
  </g>
</svg>
