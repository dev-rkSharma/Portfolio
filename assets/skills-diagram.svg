<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Diagram of source systems flowing through a governed pipeline into an ontology core, which powers a Workshop application and a timeseries dashboard">
  <defs>
    <pattern id="sk-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.1" cy="1.1" r="1.1" fill="#ABB2BF" />
    </pattern>
    <marker id="sk-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#C778DD" />
    </marker>
  </defs>

  <!-- panel + dot field + frame: identical treatment to assets/project-*.svg -->
  <rect width="600" height="340" fill="#ffffff" />
  <rect width="600" height="340" fill="url(#sk-dots)" opacity="0.12" />
  <rect x="0.5" y="0.5" width="599" height="339" fill="none" stroke="#3D434D" />

  <!-- source systems -->
  <g stroke="#ABB2BF" stroke-opacity="0.55" fill="none">
    <rect x="40" y="76" width="88" height="38" />
    <rect x="40" y="151" width="88" height="38" />
    <rect x="40" y="226" width="88" height="38" />
  </g>
  <g stroke="#ABB2BF" stroke-opacity="0.35">
    <line x1="52" y1="90" x2="108" y2="90" />
    <line x1="52" y1="100" x2="92" y2="100" />
    <line x1="52" y1="165" x2="108" y2="165" />
    <line x1="52" y1="175" x2="92" y2="175" />
    <line x1="52" y1="240" x2="108" y2="240" />
    <line x1="52" y1="250" x2="92" y2="250" />
  </g>

  <!-- convergence into the pipeline stage -->
  <g stroke="#C778DD" stroke-width="1.5" fill="none" opacity="0.85" marker-end="url(#sk-arrow)">
    <path d="M128 95 C 150 95, 158 130, 174 152" />
    <path d="M128 170 L 174 170" />
    <path d="M128 245 C 150 245, 158 210, 174 188" />
  </g>

  <!-- pipeline stage: transform steps, deliberately quiet so the core leads -->
  <g>
    <rect x="178" y="128" width="90" height="84" fill="none" stroke="#ABB2BF" stroke-opacity="0.55" />
    <g fill="#ABB2BF" opacity="0.28">
      <rect x="194" y="150" width="62" height="6" />
      <rect x="194" y="166" width="62" height="6" />
      <rect x="194" y="182" width="42" height="6" />
    </g>
  </g>

  <path d="M268 170 L 306 170" stroke="#C778DD" stroke-width="1.5" opacity="0.85" marker-end="url(#sk-arrow)" fill="none" />

  <!-- ontology core: actual Palantir application artwork -->
<image data-product-icon="ontology" x="317" y="137" width="66" height="66" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>
<!-- core out to the two surfaces -->
  <g stroke="#C778DD" stroke-width="1.5" fill="none" opacity="0.85" marker-end="url(#sk-arrow)">
    <path d="M394 152 C 404 152, 408 130, 420 118" />
    <path d="M394 190 C 404 190, 408 210, 420 222" />
  </g>

  <!-- surface 1: Workshop application with a chart -->
  <g>
    <rect x="424" y="88" width="136" height="80" fill="none" stroke="#ABB2BF" stroke-opacity="0.55" />
    <rect x="436" y="100" width="104" height="8" fill="#ABB2BF" opacity="0.2" />
    <line x1="436" y1="154" x2="548" y2="154" stroke="#ABB2BF" stroke-opacity="0.4" />
    <g fill="#C778DD" opacity="0.55">
      <rect x="438" y="132" width="14" height="22" />
      <rect x="460" y="120" width="14" height="34" />
      <rect x="482" y="138" width="14" height="16" />
      <rect x="504" y="126" width="14" height="28" />
      <rect x="526" y="116" width="14" height="38" />
    </g>
  </g>

  <!-- surface 2: timeseries / Quiver trend -->
  <g>
    <rect x="424" y="190" width="136" height="76" fill="none" stroke="#ABB2BF" stroke-opacity="0.55" />
    <g stroke="#ABB2BF" stroke-opacity="0.18">
      <line x1="436" y1="214" x2="548" y2="214" />
      <line x1="436" y1="240" x2="548" y2="240" />
    </g>
    <line x1="436" y1="256" x2="548" y2="256" stroke="#ABB2BF" stroke-opacity="0.4" />
    <polyline points="436,248 458,232 480,240 502,214 524,222 548,204"
              fill="none" stroke="#C778DD" stroke-opacity="0.55" stroke-width="1.5" />
  </g>
</svg>
