<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Abstract diagram of a request reaching an agent hub, which calls an LLM, Ontology and AI Analyst tools, converging into a decision output">
  <defs>
    <pattern id="p6-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.1" cy="1.1" r="1.1" fill="#A6B5CD" />
    </pattern>
    <marker id="p6-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#B49AFF" />
    </marker>
  </defs>

  <rect width="600" height="340" fill="#ffffff" />
  <rect x="0" y="0" width="150" height="150" fill="url(#p6-dots)" opacity="0.14" />
  <rect x="0.5" y="0.5" width="599" height="339" fill="none" stroke="#35415A" />

  <!-- request -->
  <g stroke="#A6B5CD" stroke-opacity="0.55" fill="none">
    <rect x="34" y="140" width="92" height="60" />
  </g>
  <g stroke="#A6B5CD" stroke-opacity="0.35">
    <line x1="50" y1="158" x2="110" y2="158" />
    <line x1="50" y1="170" x2="94" y2="170" />
    <line x1="50" y1="182" x2="102" y2="182" />
  </g>

  <!-- request -> agent hub -->
  <path class="data-path" d="M126 170 L 196 170" stroke="#B49AFF" stroke-width="1.5" opacity="0.85" marker-end="url(#p6-arrow)" fill="none" />

  <!-- agent hub: highlighted node with a sparkle mark (never the brand logo mark) -->
  <circle cx="228" cy="170" r="24" fill="#0B0F19" stroke="#B49AFF" stroke-width="2" />
  <path d="M228 158 l4 8 8 4 -8 4 -4 8 -4-8 -8-4 8-4z" fill="#B49AFF" />

  <!-- hub -> tool nodes -->
  <g class="data-path" stroke="#B49AFF" stroke-width="1.5" opacity="0.75" fill="none" marker-end="url(#p6-arrow)">
    <path d="M248 155 C 300 130, 320 108, 356 92" />
    <path d="M252 170 L 356 170" />
    <path d="M248 185 C 300 210, 320 232, 356 248" />
  </g>

  <!-- tool nodes: LLM / Ontology / AI Analyst -->
  <g fill="#111522" stroke="#A6B5CD">
    <circle cx="372" cy="86" r="16" />
    <circle cx="372" cy="170" r="16" />
    <circle cx="372" cy="252" r="16" />
  </g>
  <g fill="none" stroke="#A6B5CD" stroke-width="1.5">
    <path d="M365 86 v-6 M372 86 v-8 M379 86 v-4" />
    <image data-product-icon="ontology" x="358" y="156" width="28" height="28" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>
    <image data-product-icon="aip" x="358" y="238" width="28" height="28" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>
  </g>
  <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#A6B5CD" text-anchor="middle">
    <text x="372" y="112">LLM</text>
    <text x="372" y="196">Ontology</text>
    <text x="372" y="278">AI Analyst</text>
  </g>

  <!-- tool nodes -> decision output -->
  <g class="data-path" stroke="#B49AFF" stroke-width="1.5" opacity="0.75" fill="none" marker-end="url(#p6-arrow)">
    <path d="M388 92 C 420 100, 434 120, 452 140" />
    <path d="M388 170 L 452 170" />
    <path d="M388 246 C 420 236, 434 216, 452 196" />
  </g>

  <!-- decision output: chat-bubble panel -->
  <path d="M460.5 60.5 h108 a6 6 0 0 1 6 6 v148 a6 6 0 0 1 -6 6 h-84 l-24 22 v-22 h-0.5 a6 6 0 0 1 -6 -6 v-148 a6 6 0 0 1 6 -6 Z"
        fill="none" stroke="#A6B5CD" stroke-opacity="0.55" />
  <rect x="478" y="82" width="76" height="9" fill="#A6B5CD" opacity="0.2" />
  <g fill="#B49AFF" opacity="0.85">
    <rect x="478" y="108" width="76" height="7" />
    <rect x="478" y="124" width="56" height="7" />
    <rect x="478" y="140" width="66" height="7" />
  </g>
  <line x1="478" y1="164" x2="554" y2="164" stroke="#A6B5CD" stroke-opacity="0.4" />
  <text x="478" y="182" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#B49AFF">recommend()</text>
</svg>
