<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Abstract diagram of source systems feeding a governed pipeline into an automated report">
  <defs>
    <pattern id="p1-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.1" cy="1.1" r="1.1" fill="#ABB2BF" />
    </pattern>
    <marker id="p1-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#C778DD" />
    </marker>
  </defs>

  <rect width="600" height="340" fill="#2E333B" />
  <rect width="600" height="340" fill="url(#p1-dots)" opacity="0.12" />
  <rect x="0.5" y="0.5" width="599" height="339" fill="none" stroke="#3D434D" />

  <!-- source systems -->
  <g stroke="#ABB2BF" stroke-opacity="0.55" fill="none">
    <rect x="42" y="66" width="96" height="46" />
    <rect x="42" y="147" width="96" height="46" />
    <rect x="42" y="228" width="96" height="46" />
  </g>
  <g stroke="#ABB2BF" stroke-opacity="0.35">
    <line x1="58" y1="83" x2="122" y2="83" />
    <line x1="58" y1="95" x2="106" y2="95" />
    <line x1="58" y1="164" x2="122" y2="164" />
    <line x1="58" y1="176" x2="106" y2="176" />
    <line x1="58" y1="245" x2="122" y2="245" />
    <line x1="58" y1="257" x2="106" y2="257" />
  </g>

  <!-- convergence lines into the pipeline node -->
  <g class="data-path" stroke="#C778DD" stroke-width="1.5" fill="none" opacity="0.85" marker-end="url(#p1-arrow)">
    <path d="M138 89 C 200 89, 220 120, 262 158" />
    <path d="M138 170 L 258 170" />
    <path d="M138 251 C 200 251, 220 220, 262 182" />
  </g>

  <!-- pipeline node: echoes the site's logo mark -->
  <g transform="translate(262,140)">
    <rect x="0.5" y="0.5" width="42" height="42" fill="none" stroke="#C778DD" />
    <rect x="26" y="26" width="45" height="45" fill="#C778DD" />
  </g>

  <!-- arrow from pipeline to report -->
  <path class="data-path" d="M334 168 L 388 154" stroke="#C778DD" stroke-width="1.5" opacity="0.85" marker-end="url(#p1-arrow)" fill="none" />

  <!-- output report panel -->
  <g>
    <rect x="398" y="58" width="160" height="224" fill="none" stroke="#ABB2BF" stroke-opacity="0.55" />
    <rect x="414" y="76" width="128" height="9" fill="#ABB2BF" opacity="0.2" />
    <line x1="414" y1="240" x2="542" y2="240" stroke="#ABB2BF" stroke-opacity="0.4" />
    <g fill="#C778DD" opacity="0.85">
      <rect x="418" y="196" width="16" height="44" />
      <rect x="444" y="172" width="16" height="68" />
      <rect x="470" y="208" width="16" height="32" />
      <rect x="496" y="160" width="16" height="80" />
      <rect x="522" y="184" width="16" height="56" />
    </g>
  </g>
</svg>
