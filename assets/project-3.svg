<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Abstract process-mining node graph with a governance checkpoint highlighted by a lock icon">
  <defs>
    <pattern id="p3-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.1" cy="1.1" r="1.1" fill="#ABB2BF" />
    </pattern>
  </defs>

  <rect width="600" height="340" fill="#2E333B" />
  <rect x="420" y="20" width="150" height="150" fill="url(#p3-dots)" opacity="0.16" />
  <rect x="0.5" y="0.5" width="599" height="339" fill="none" stroke="#3D434D" />
  <rect x="36" y="230" width="72" height="72" fill="none" stroke="#C778DD" opacity="0.35" />

  <!-- process-mining flow edges -->
  <g stroke="#ABB2BF" stroke-opacity="0.55" fill="none">
    <path d="M96 120 L 210 84" />
    <path d="M96 120 L 210 176" />
    <path d="M210 84 L 318 130" />
    <path d="M210 176 L 318 130" />
    <path d="M318 130 L 430 96" />
    <path d="M318 130 L 430 206" />
    <path d="M430 96 L 528 158" />
    <path d="M430 206 L 528 158" />
  </g>
  <g stroke="#ABB2BF" stroke-opacity="0.3" stroke-dasharray="4 4" fill="none">
    <path d="M210 84 L 318 130" />
    <path d="M96 120 L 318 130" />
  </g>

  <!-- nodes -->
  <g fill="#2E333B" stroke="#ABB2BF">
    <circle cx="96" cy="120" r="12" />
    <circle cx="210" cy="84" r="10" />
    <circle cx="210" cy="176" r="10" />
    <circle cx="430" cy="96" r="10" />
    <circle cx="430" cy="206" r="10" />
    <circle cx="528" cy="158" r="12" />
  </g>

  <!-- governance checkpoint node, highlighted -->
  <circle cx="318" cy="130" r="16" fill="#282C33" stroke="#C778DD" stroke-width="2" />
  <g transform="translate(318,130)" stroke="#C778DD" stroke-width="1.75" fill="none">
    <rect x="-7" y="-2" width="14" height="11" rx="1" />
    <path d="M-4 -2 v-4 a4 4 0 0 1 8 0 v4" />
  </g>

  <!-- caption strip -->
  <g font-family="'Fira Code', monospace" font-size="13">
    <rect x="242" y="258" width="152" height="26" fill="#282C33" stroke="#3D434D" />
    <text x="318" y="275" text-anchor="middle" fill="#ABB2BF">access&#160;checkpoint</text>
  </g>
</svg>
